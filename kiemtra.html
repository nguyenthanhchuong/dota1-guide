<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Kiểm tra</title></head><body>
<pre id="out">Đang chạy…</pre>
<script src="heroes-base.js"></script>
<script src="items.js"></script>
<script src="data.js"></script>
<script src="heroes-them.js"></script>
<script>
const loi = [];
const canhBao = [];
const HD = [].concat(HEROES, HEROES_THEM);
const idBase = new Set(HERO_BASE.map(h => h.id));

// 1. id trung lap trong huong dan
const ids = HD.map(h => h.id);
ids.filter((v,i)=>ids.indexOf(v)!==i).forEach(v => loi.push("Trùng id hướng dẫn: " + v));

// 2. huong dan tro toi id khong ton tai
HD.forEach(h => { if (!idBase.has(h.id)) loi.push("Hướng dẫn cho id lạ: " + h.id); });

// 3. tuong nao chua co huong dan
const coHD = new Set(ids);
HERO_BASE.forEach(b => { if (!coHD.has(b.id)) canhBao.push("Chưa có hướng dẫn: " + b.id); });

// 4. truong bat buoc
HD.forEach(h => {
  if (!Array.isArray(h.skills) || h.skills.length < 3) loi.push(h.id + ": thiếu skills");
  else h.skills.forEach((s,i) => { if(!s.phim||!s.ten||!s.mota) loi.push(h.id+": skill "+i+" thiếu trường"); });
  if (!h.lenSkill) loi.push(h.id + ": thiếu lenSkill");
  if (!h.doBuild) { loi.push(h.id + ": thiếu doBuild"); return; }
  ["khoiDau","giaiDoanDau","coreItem","xaXi"].forEach(k => {
    if (!Array.isArray(h.doBuild[k]) || !h.doBuild[k].length) loi.push(h.id+": doBuild."+k+" rỗng");
  });
  if (!Array.isArray(h.chienThuat) || !h.chienThuat.length) loi.push(h.id + ": thiếu chienThuat");
  if (!Array.isArray(h.khacChe) || !h.khacChe.length) loi.push(h.id + ": thiếu khacChe");
});

// 5. ten item khong hop le
const itemLoi = {};
HD.forEach(h => {
  if (!h.doBuild) return;
  Object.values(h.doBuild).forEach(arr => (arr||[]).forEach(it => {
    if (!ITEM_MAP[it]) { itemLoi[it] = (itemLoi[it]||[]); itemLoi[it].push(h.id); }
  }));
});
Object.keys(itemLoi).forEach(it => loi.push('Item không có trong danh mục: "'+it+'" (dùng bởi: '+itemLoi[it].join(", ")+')'));

// 6. item thieu anh/gia
ITEMS.forEach(it => { if (!it.file) loi.push("Item thiếu ảnh: " + it.ten); });

const chuaChac = HD.filter(h => h.chuaChac).map(h => h.id);

document.getElementById('out').textContent =
  "Tổng tướng trong danh sách: " + HERO_BASE.length +
  "\nTổng hướng dẫn: " + HD.length +
  "\nTổng item: " + ITEMS.length +
  "\nĐánh dấu chưa chắc (" + chuaChac.length + "): " + chuaChac.join(", ") +
  "\n\n=== LỖI (" + loi.length + ") ===\n" + (loi.join("\n") || "(không có)") +
  "\n\n=== CHÚ Ý (" + canhBao.length + ") ===\n" + (canhBao.join("\n") || "(không có)");
</script></body></html>
